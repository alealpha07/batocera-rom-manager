{% extends "base.html" %}
{% block title %}Choose a password - Batocera Rom Manager{% endblock %}
{% block body %}
<main class="container py-5 auth-form">
  <h1 class="h4 mb-3">Choose a password</h1>
  <p class="text-body-secondary">Every device that opens Rom Manager will ask for it.</p>
  {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
  <form method="post">
    <div class="mb-3">
      <label class="form-label" for="password">Password</label>
      <input class="form-control" type="password" id="password" name="password" autocomplete="new-password" required autofocus>
    </div>
    <div class="mb-3">
      <label class="form-label" for="confirm">Repeat password</label>
      <input class="form-control" type="password" id="confirm" name="confirm" autocomplete="new-password" required>
    </div>
    <button class="btn btn-primary w-100" type="submit">Save</button>
  </form>
</main>
{% endblock %}
