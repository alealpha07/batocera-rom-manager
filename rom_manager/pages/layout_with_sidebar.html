{% extends "layout.html" %}
{% block body %}
<div class="container-fluid">
  <div class="row">
    <div class="col-md-3 col-xl-2 border-end p-0">
      <div class="offcanvas-md offcanvas-start sidebar" tabindex="-1" id="sidebar" aria-labelledby="sidebar-title">
        <div class="offcanvas-header">
          <h2 class="offcanvas-title h5" id="sidebar-title">Systems</h2>
          <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#sidebar" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body p-0 flex-column">
          <form class="form-check form-switch px-3 py-2 ps-5 mb-0 border-bottom small" method="post" action="/sidebar/empty">
            <input type="hidden" name="next" value="{{ here }}">
            <input class="form-check-input" type="checkbox" role="switch" id="show-empty" name="show_empty" value="1"{% if sidebar.show_empty %} checked{% endif %} data-autosubmit>
            <label class="form-check-label" for="show-empty">Show empty systems</label>
          </form>
          <nav class="list-group list-group-flush w-100">
            <a class="list-group-item list-group-item-action d-flex justify-content-between align-items-center{% if not sidebar.current %} active{% endif %}" href="/games{% if sidebar.show_hidden %}?hidden=1{% endif %}">
              All games
              <span class="badge text-bg-secondary rounded-pill">{{ sidebar.total }}</span>
            </a>
            {% for system, game_count in sidebar.systems %}
            <a class="list-group-item list-group-item-action d-flex justify-content-between align-items-center{% if system.name == sidebar.current %} active{% elif not game_count %} text-body-tertiary{% endif %}" href="/games?system={{ system.name | urlencode }}{% if sidebar.show_hidden %}&amp;hidden=1{% endif %}">
              {{ system.fullname }}
              {% if game_count %}<span class="badge text-bg-secondary rounded-pill">{{ game_count }}</span>{% endif %}
            </a>
            {% endfor %}
          </nav>
        </div>
      </div>
    </div>
    <main class="col-md-9 col-xl-10 py-3">
      <button class="btn btn-outline-secondary btn-sm d-md-none mb-3" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-controls="sidebar">Systems</button>
      {% block main %}{% endblock %}
    </main>
  </div>
</div>
{% endblock %}
