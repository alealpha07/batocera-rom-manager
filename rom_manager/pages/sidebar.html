<div class="col-md-3 col-xl-2 border-end p-0">
  <div class="offcanvas-md offcanvas-start sidebar" tabindex="-1" id="sidebar" aria-labelledby="sidebar-title">
    <div class="offcanvas-header">
      <h2 class="offcanvas-title h5" id="sidebar-title">Systems</h2>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#sidebar" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body p-0 flex-column">
      <form class="form-check form-switch px-3 py-2 ps-5 mb-0 border-bottom small" method="post" action="/sidebar/empty">
        <input type="hidden" name="next" value="{{ sidebar.next }}">
        <input class="form-check-input" type="checkbox" role="switch" id="show-empty" name="show_empty" value="1"{% if sidebar.show_empty %} checked{% endif %} onchange="this.form.submit()">
        <label class="form-check-label" for="show-empty">Show empty systems</label>
      </form>
      <nav class="list-group list-group-flush w-100">
        <a class="list-group-item list-group-item-action d-flex justify-content-between align-items-center{% if not current %} active{% endif %}" href="/games{% if hidden %}?hidden=1{% endif %}">
          All games
          <span class="badge text-bg-secondary rounded-pill">{{ sidebar.total }}</span>
        </a>
        {% for system in sidebar.systems %}
        <a class="list-group-item list-group-item-action d-flex justify-content-between align-items-center{% if system.name == current %} active{% elif not system.games %} text-body-tertiary{% endif %}" href="/games?system={{ system.name | urlencode }}{% if hidden %}&amp;hidden=1{% endif %}">
          {{ system.fullname }}
          {% if system.games %}<span class="badge text-bg-secondary rounded-pill">{{ system.games }}</span>{% endif %}
        </a>
        {% endfor %}
      </nav>
    </div>
  </div>
</div>
<script>{% include "sidebar.js" %}</script>
