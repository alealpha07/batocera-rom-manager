{% extends "layout.html" %}
{% block title %}Log in - Batocera Rom Manager{% endblock %}
{% block body %}
<main class="container py-5 auth-form">
  <h1 class="h4 mb-3">Log in</h1>
  {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
  <form method="post">
    <div class="mb-3">
      <label class="form-label" for="password">Password</label>
      <input class="form-control" type="password" id="password" name="password" autocomplete="current-password" required autofocus>
    </div>
    <button class="btn btn-primary w-100" type="submit">Log in</button>
  </form>
</main>
{% endblock %}
