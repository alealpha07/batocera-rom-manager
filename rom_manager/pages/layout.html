<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Batocera Rom Manager{% endblock %}</title>
  <link rel="stylesheet" href="/static/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/theme.js"></script>
</head>
<body>
  <nav class="navbar bg-body-tertiary border-bottom app-navbar">
    <div class="container-fluid">
      <a class="navbar-brand" href="/">Batocera Rom Manager</a>
      <div class="d-flex flex-wrap align-items-center gap-2">
        {% if logged_in %}
        {% if checking %}
        <button class="btn btn-warning btn-sm me-2" type="button" data-bs-toggle="modal" data-bs-target="#check-modal">Checking {{ [checking.done + 1, checking.total] | min }}/{{ checking.total }}</button>
        {% elif running %}
        <form class="d-flex align-items-center gap-2 me-2" method="post" action="/running/quit" data-confirm="Quit {{ running.name }}? Unsaved progress is lost." onsubmit="if (!confirm(this.dataset.confirm)) return false; this.querySelector('button').disabled = true">
          <input type="hidden" name="next" value="{{ here }}">
          <input type="hidden" name="running" value="{{ running.path }}">
          <a class="running-game text-truncate" href="{{ running.url }}" title="{{ running.name }} is running">▶&#xFE0E; {{ running.name }}</a>
          <button class="btn btn-danger btn-sm" type="submit">Quit</button>
        </form>
        {% endif %}
        {% endif %}
        <button class="btn btn-outline-secondary btn-sm" type="button" id="theme-switch">☾&#xFE0E;</button>
        {% if logged_in %}
        <form method="post" action="/logout">
          <button class="btn btn-outline-secondary btn-sm" type="submit">Log out</button>
        </form>
        <a class="btn btn-outline-primary btn-sm" href="/support">Support</a>
        <a class="btn btn-outline-primary btn-sm" href="/collections">Collections</a>
        <a class="btn btn-outline-primary btn-sm" href="/bios">BIOS</a>
        <button class="btn btn-outline-primary btn-sm" type="button" data-bs-toggle="modal" data-bs-target="#check-modal"{% if current %} data-check-system="{{ current }}"{% endif %}>Boot check</button>
        <a class="btn btn-primary btn-sm" href="/add">Add ROMs</a>
        {% endif %}
      </div>
    </div>
  </nav>
  {% block body %}{% endblock %}
  {% if logged_in %}{% include "check/check.html" %}{% endif %}
  <script src="/static/vendor/bootstrap/bootstrap.bundle.min.js"></script>
</body>
</html>
